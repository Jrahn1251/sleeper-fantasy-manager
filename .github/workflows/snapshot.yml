name: Publish fantasy snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 2'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: fantasy-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python snapshot.py
      - run: |
          git config user.name 'fantasy-snapshot[bot]'
          git config user.email 'fantasy-snapshot[bot]@users.noreply.github.com'
          git add snapshot.json
          git diff --cached --quiet || (git commit -m 'Refresh fantasy snapshot' && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4

